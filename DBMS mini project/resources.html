<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic Resources | Campus Knowledge Repository">

    <link rel="stylesheet" href="style.css">
</head>


<body class="app-page resources-page">


    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <div class="app-background">

        <div class="app-orb app-orb-one"></div>
        <div class="app-orb app-orb-two"></div>
        <div class="app-orb app-orb-three"></div>

        <div class="app-arc app-arc-one"></div>
        <div class="app-arc app-arc-two"></div>

    </div>



    <!-- =========================================================
         APPLICATION SHELL
         ========================================================= -->

    <div class="app-shell" id="appShell">


        <!-- =====================================================
             SIDEBAR
             ===================================================== -->

        <aside
            class="sidebar"
            id="studentSidebar"
        >


            <!-- Brand -->
            <div class="sidebar-brand">

                <div class="sidebar-logo">

                    <img
                        src="assets/logo.png"
                        alt="Campus Knowledge Repository"
                    >

                </div>

                <div class="sidebar-brand-text">

                    <span>
                        Campus Knowledge
                    </span>

                    <span>
                        Repository
                    </span>

                </div>

            </div>



            <!-- Navigation -->
            <nav
                class="sidebar-navigation"
                aria-label="Student navigation"
            >


                <!-- Dashboard -->
                <a
                    href="dashboard.html"
                    class="sidebar-link"
                    data-page="dashboard"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 10.5 12 3l9 7.5"></path>
                            <path d="M5 9.5V21h14V9.5"></path>
                            <path d="M9 21v-6h6v6"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Dashboard
                    </span>

                </a>



                <!-- Interview -->
                <a
                    href="interview.html"
                    class="sidebar-link"
                    data-page="interview"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect
                                x="3"
                                y="7"
                                width="18"
                                height="13"
                                rx="2"
                            ></rect>

                            <path d="M8 7V5h8v2"></path>
                            <path d="M3 12h18"></path>
                            <path d="M10 12v2h4v-2"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Interview Experiences
                    </span>

                </a>



                <!-- Hackathon -->
                <a
                    href="hackathon.html"
                    class="sidebar-link"
                    data-page="hackathon"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 7h8"></path>
                            <path d="M9 4h6v3H9z"></path>
                            <path d="M7 7v3"></path>
                            <path d="M17 7v3"></path>
                            <path d="M6 10h12"></path>
                            <path d="M12 10v8"></path>
                            <path d="M9 21h6"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Hackathon Experiences
                    </span>

                </a>



                <!-- Club -->
                <a
                    href="club.html"
                    class="sidebar-link"
                    data-page="club"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">

                            <circle
                                cx="9"
                                cy="8"
                                r="3"
                            ></circle>

                            <circle
                                cx="17"
                                cy="9"
                                r="2.5"
                            ></circle>

                            <path
                                d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"
                            ></path>

                            <path
                                d="M15 15c3 0 5 2 5 5"
                            ></path>

                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Club Reviews
                    </span>

                </a>



                <!-- Resources -->
                <a
                    href="resources.html"
                    class="sidebar-link active"
                    data-page="resources"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">

                            <path d="M5 3h10l4 4v14H5z"></path>

                            <path d="M15 3v5h5"></path>

                            <path d="M8 12h8"></path>

                            <path d="M8 16h8"></path>

                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Academic Resources
                    </span>

                </a>



                <!-- Placement -->
                <a
                    href="placement.html"
                    class="sidebar-link"
                    data-page="placement"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">

                            <path d="M5 20V10"></path>

                            <path d="M12 20V5"></path>

                            <path d="M19 20V8"></path>

                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Placement Information
                    </span>

                </a>

            </nav>



            <!-- Logout -->
            <div class="sidebar-bottom">

                <button
                    type="button"
                    class="sidebar-logout"
                    id="logoutButton"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">

                            <path d="M10 5H5v14h5"></path>

                            <path d="M14 8l4 4-4 4"></path>

                            <path d="M18 12H9"></path>

                        </svg>

                    </span>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </aside>



        <!-- =====================================================
             MAIN AREA
             ===================================================== -->

        <div class="app-main">


            <!-- =================================================
                 TOPBAR
                 ================================================= -->

            <header class="topbar">

                <div class="topbar-left">


                    <!-- Hamburger -->
                    <button
                        type="button"
                        class="menu-button"
                        id="sidebarToggle"
                        aria-label="Toggle navigation"
                        aria-expanded="true"
                    >

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>



                    <!-- Brand -->
                    <a
                        href="dashboard.html"
                        class="topbar-brand"
                    >

                        <span class="topbar-logo">

                            <img
                                src="assets/logo.png"
                                alt=""
                            >

                        </span>

                        <span class="topbar-brand-text">
                            Campus Knowledge Repository
                        </span>

                    </a>

                </div>



                <!-- Profile -->
                <div class="topbar-right">

                    <button
                        type="button"
                        class="profile-button"
                        id="profileButton"
                        aria-label="Open profile"
                    >

                        <span
                            class="profile-avatar"
                            id="topbarProfileAvatar"
                        >

                            <span id="topbarInitial">
                                —
                            </span>

                        </span>

                    </button>

                </div>

            </header>



            <!-- =================================================
                 PAGE CONTENT
                 ================================================= -->

            <main class="page-content resources-content">


                <!-- =============================================
                     HEADER
                     ============================================= -->

                <section class="content-header">

                    <p class="content-eyebrow">
                        LEARN
                    </p>

                    <h1>
                        Academic Resources
                    </h1>

                    <p class="content-subtitle">
                        Find useful study material shared by your
                        campus community.
                    </p>

                </section>



                <!-- =============================================
                     SEARCH
                     ============================================= -->

                <section class="resource-toolbar">


                    <!-- Search -->
                    <div class="experience-search-wrapper resource-search-wrapper">

                        <span class="search-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <circle
                                    cx="11"
                                    cy="11"
                                    r="7"
                                ></circle>

                                <path
                                    d="m16.5 16.5 4 4"
                                ></path>

                            </svg>

                        </span>

                        <input
                            type="search"
                            id="resourceSearch"
                            class="experience-search"
                            placeholder="Search by title or subject..."
                            autocomplete="off"
                        >

                    </div>



                    <!-- Upload -->
                    <button
                        type="button"
                        class="resource-upload-top-button"
                        id="resourceUploadTopButton"
                    >

                        <span>
                            +
                        </span>

                        <span>
                            Upload
                        </span>

                    </button>

                </section>



                <!-- =============================================
                     FILTERS
                     ============================================= -->

                <section
                    class="filter-bar resource-filter-bar"
                    aria-label="Resource filters"
                >


                    <!-- Subject -->
                    <div class="filter-control">

                        <label
                            for="resourceSubjectFilter"
                            class="sr-only"
                        >
                            Subject
                        </label>

                        <select
                            id="resourceSubjectFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Subject
                            </option>

                        </select>

                    </div>



                    <!-- Semester -->
                    <div class="filter-control">

                        <label
                            for="resourceSemesterFilter"
                            class="sr-only"
                        >
                            Semester
                        </label>

                        <select
                            id="resourceSemesterFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Semester
                            </option>

                        </select>

                    </div>



                    <!-- Clear -->
                    <button
                        type="button"
                        class="clear-filters-button"
                        id="clearResourceFilters"
                    >
                        Clear Filters
                    </button>

                </section>



                <!-- =============================================
                     RESOURCE RESULTS
                     ============================================= -->

                <section
                    class="resource-results"
                    id="resourceResults"
                >


                    <!-- =========================================
                         EMPTY STATE
                         ========================================= -->

                    <div
                        class="empty-state resource-empty-state"
                        id="resourceEmptyState"
                    >

                        <div class="empty-state-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M5 3h10l4 4v14H5z"
                                ></path>

                                <path
                                    d="M15 3v5h5"
                                ></path>

                                <path
                                    d="M8 12h8"
                                ></path>

                                <path
                                    d="M8 16h6"
                                ></path>

                            </svg>

                        </div>


                        <h2>
                            No academic resources yet
                        </h2>


                        <p>
                            Be the first to share useful study material
                            with your campus community.
                        </p>


                        <button
                            type="button"
                            class="empty-state-action"
                            id="emptyResourceUploadButton"
                        >

                            <span>
                                +
                            </span>

                            <span>
                                Upload Resource
                            </span>

                        </button>

                    </div>



                    <!-- =========================================
                         DYNAMIC RESOURCE CARDS
                         
                         MySQL → Flask → JavaScript
                         
                         No dummy resources.
                         ========================================= -->

                    <div
                        class="resource-card-grid"
                        id="resourceCardGrid"
                    ></div>

                </section>



                <!-- =============================================
                     UPLOAD RESOURCE SECTION
                     ============================================= -->

                <section
                    class="contribution-section resource-upload-section"
                    id="uploadResourceSection"
                >

                    <div class="contribution-panel">


                        <!-- Heading -->
                        <div class="contribution-heading">

                            <div class="contribution-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M5 3h10l4 4v14H5z"
                                    ></path>

                                    <path
                                        d="M15 3v5h5"
                                    ></path>

                                    <path
                                        d="M12 18V10"
                                    ></path>

                                    <path
                                        d="m9 13 3-3 3 3"
                                    ></path>

                                </svg>

                            </div>


                            <div>

                                <p class="contribution-eyebrow">
                                    CONTRIBUTE
                                </p>

                                <h2>
                                    Upload Your Resources
                                </h2>

                                <p>
                                    Share useful academic material
                                    with your campus community.
                                </p>

                            </div>

                        </div>



                        <!-- =====================================
                             RESOURCE FORM
                             ===================================== -->

                        <form
                            id="resourceForm"
                            class="contribution-form"
                            novalidate
                        >


                            <!-- Title -->
                            <div class="form-field">

                                <label for="resourceTitle">
                                    Title
                                    <span>*</span>
                                </label>

                                <input
                                    type="text"
                                    id="resourceTitle"
                                    name="title"
                                    placeholder="e.g. DBMS Unit 3 Notes"
                                    required
                                >

                            </div>



                            <!-- Subject -->
                            <div class="form-field">

                                <label for="resourceSubject">
                                    Subject
                                    <span>*</span>
                                </label>

                                <input
                                    type="text"
                                    id="resourceSubject"
                                    name="subject"
                                    placeholder="e.g. Database Management Systems"
                                    required
                                >

                            </div>



                            <!-- Semester -->
                            <div class="form-field">

                                <label for="resourceSemester">
                                    Semester
                                    <span class="optional-label">
                                        Optional
                                    </span>
                                </label>

                                <select
                                    id="resourceSemester"
                                    name="semester"
                                >

                                    <option value="">
                                        Select semester
                                    </option>

                                    <option value="1">
                                        Semester 1
                                    </option>

                                    <option value="2">
                                        Semester 2
                                    </option>

                                    <option value="3">
                                        Semester 3
                                    </option>

                                    <option value="4">
                                        Semester 4
                                    </option>

                                    <option value="5">
                                        Semester 5
                                    </option>

                                    <option value="6">
                                        Semester 6
                                    </option>

                                    <option value="7">
                                        Semester 7
                                    </option>

                                    <option value="8">
                                        Semester 8
                                    </option>

                                </select>

                            </div>



                            <!-- Description -->
                            <div class="form-field form-field-full">

                                <label for="resourceDescription">
                                    Description
                                    <span>*</span>
                                </label>

                                <textarea
                                    id="resourceDescription"
                                    name="description"
                                    rows="6"
                                    placeholder="Briefly describe what this resource contains and how it can help students..."
                                    required
                                ></textarea>

                            </div>



                            <!-- Resource Link -->
                            <div class="form-field form-field-full">

                                <label for="resourceLink">
                                    Resource Link
                                    <span class="optional-label">
                                        Optional if uploading a file
                                    </span>
                                </label>

                                <input
                                    type="url"
                                    id="resourceLink"
                                    name="fileLink"
                                    placeholder="Paste Google Drive, OneDrive, GitHub, or other resource link..."
                                >

                            </div>



                            <!-- File Upload -->
                            <div class="form-field form-field-full">

                                <label for="resourceFile">
                                    Upload File
                                    <span class="optional-label">
                                        Optional if providing a link
                                    </span>
                                </label>

                                <div
                                    class="file-upload-area"
                                    id="resourceFileDropArea"
                                >

                                    <input
                                        type="file"
                                        id="resourceFile"
                                        name="file"
                                        class="file-upload-input"
                                    >

                                    <label
                                        for="resourceFile"
                                        class="file-upload-label"
                                    >

                                        <span class="file-upload-icon">

                                            <svg
                                                viewBox="0 0 24 24"
                                                aria-hidden="true"
                                            >

                                                <path
                                                    d="M12 16V4"
                                                ></path>

                                                <path
                                                    d="m7 9 5-5 5 5"
                                                ></path>

                                                <path
                                                    d="M5 14v5h14v-5"
                                                ></path>

                                            </svg>

                                        </span>

                                        <span class="file-upload-title">
                                            Choose a file
                                        </span>

                                        <span class="file-upload-subtitle">
                                            or drag and drop it here
                                        </span>

                                    </label>

                                    <p
                                        class="selected-file-name"
                                        id="selectedResourceFileName"
                                    ></p>

                                </div>

                            </div>



                            <!-- Premium -->
                            <div class="resource-premium-option">

                                <label class="checkbox-option">

                                    <input
                                        type="checkbox"
                                        id="resourcePremium"
                                        name="premium"
                                    >

                                    <span class="custom-checkbox"></span>

                                    <span class="checkbox-text">

                                        <strong>
                                            Mark as Premium
                                        </strong>

                                        <small>
                                            Premium resources can be unlocked
                                            through the knowledge-points system.
                                        </small>

                                    </span>

                                </label>

                            </div>



                            <!-- Footer -->
                            <div class="contribution-form-footer">

                                <p class="form-required-note">

                                    <span>*</span>
                                    Required fields

                                </p>


                                <div class="form-actions">

                                    <button
                                        type="reset"
                                        class="secondary-button"
                                        id="cancelResourceForm"
                                    >
                                        Cancel
                                    </button>


                                    <button
                                        type="submit"
                                        class="primary-button"
                                    >

                                        <span>
                                            Upload Resource
                                        </span>

                                        <span>
                                            →
                                        </span>

                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </section>

            </main>

        </div>

    </div>



    <!-- =========================================================
         RESOURCE DETAILS MODAL
         ========================================================= -->

    <div
        class="app-modal-layer"
        id="resourceDetailsModal"
        aria-hidden="true"
    >

        <div
            class="details-modal resource-details-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="resourceDetailsTitle"
        >


            <!-- Close -->
            <button
                type="button"
                class="modal-close-button"
                id="closeResourceDetails"
                aria-label="Close"
            >
                ×
            </button>



            <!-- Header -->
            <div class="details-modal-header">

                <div
                    class="details-company-icon"
                    id="resourceDetailsIcon"
                >
                    —
                </div>

                <div>

                    <div class="resource-details-badges">

                        <span
                            class="resource-subject-badge"
                            id="resourceDetailsSubject"
                        >
                            —
                        </span>

                        <span
                            class="resource-premium-badge"
                            id="resourceDetailsPremiumBadge"
                        >
                            Premium
                        </span>

                    </div>

                    <h2 id="resourceDetailsTitle">
                        Resource
                    </h2>

                    <p id="resourceDetailsDate">
                        —
                    </p>

                </div>

            </div>



            <!-- Description -->
            <div class="details-section">

                <h3>
                    Description
                </h3>

                <p id="resourceDetailsDescription">
                    —
                </p>

            </div>



            <!-- Resource information -->
            <div
                class="details-meta"
                id="resourceDetailsMeta"
            ></div>



            <!-- Open Resource -->
            <a
                href="#"
                class="primary-button resource-open-button"
                id="resourceOpenButton"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span>
                    Open Resource
                </span>

                <span>
                    ↗
                </span>

            </a>

        </div>

    </div>



    <!-- =========================================================
         LOGOUT MODAL
         ========================================================= -->

    <div
        class="app-modal-layer"
        id="logoutModal"
        aria-hidden="true"
    >

        <div class="app-modal">

            <button
                type="button"
                class="modal-close-button"
                id="logoutModalClose"
                aria-label="Close"
            >
                ×
            </button>

            <div class="modal-icon">
                ↪
            </div>

            <h2>
                Log out?
            </h2>

            <p>
                Are you sure you want to leave the
                Campus Knowledge Repository?
            </p>

            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-button"
                    id="cancelLogout"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="primary-button"
                    id="confirmLogout"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="script.js"></script>

</body>

</html>
