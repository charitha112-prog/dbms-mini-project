<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Reviews | Campus Knowledge Repository">

    <link rel="stylesheet" href="style.css">
</head>


<body class="app-page club-page">


    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <div class="app-background">

        <div class="app-orb app-orb-one"></div>
        <div class="app-orb app-orb-two"></div>
        <div class="app-orb app-orb-three"></div>

        <div class="app-arc app-arc-one"></div>
        <div class="app-arc app-arc-two"></div>

    </div>



    <!-- =========================================================
         APPLICATION SHELL
         ========================================================= -->

    <div class="app-shell" id="appShell">


        <!-- =====================================================
             SIDEBAR
             ===================================================== -->

        <aside
            class="sidebar"
            id="studentSidebar"
        >


            <!-- Brand -->
            <div class="sidebar-brand">

                <div class="sidebar-logo">

                    <img
                        src="assets/logo.png"
                        alt="Campus Knowledge Repository"
                    >

                </div>

                <div class="sidebar-brand-text">

                    <span>
                        Campus Knowledge
                    </span>

                    <span>
                        Repository
                    </span>

                </div>

            </div>



            <!-- Navigation -->
            <nav
                class="sidebar-navigation"
                aria-label="Student navigation"
            >


                <!-- Dashboard -->
                <a
                    href="dashboard.html"
                    class="sidebar-link"
                    data-page="dashboard"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 10.5 12 3l9 7.5"></path>
                            <path d="M5 9.5V21h14V9.5"></path>
                            <path d="M9 21v-6h6v6"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Dashboard
                    </span>

                </a>



                <!-- Interview -->
                <a
                    href="interview.html"
                    class="sidebar-link"
                    data-page="interview"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect
                                x="3"
                                y="7"
                                width="18"
                                height="13"
                                rx="2"
                            ></rect>

                            <path d="M8 7V5h8v2"></path>
                            <path d="M3 12h18"></path>
                            <path d="M10 12v2h4v-2"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Interview Experiences
                    </span>

                </a>



                <!-- Hackathon -->
                <a
                    href="hackathon.html"
                    class="sidebar-link"
                    data-page="hackathon"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 7h8"></path>
                            <path d="M9 4h6v3H9z"></path>
                            <path d="M7 7v3"></path>
                            <path d="M17 7v3"></path>
                            <path d="M6 10h12"></path>
                            <path d="M12 10v8"></path>
                            <path d="M9 21h6"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Hackathon Experiences
                    </span>

                </a>



                <!-- Club -->
                <a
                    href="club.html"
                    class="sidebar-link active"
                    data-page="club"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">

                            <circle
                                cx="9"
                                cy="8"
                                r="3"
                            ></circle>

                            <circle
                                cx="17"
                                cy="9"
                                r="2.5"
                            ></circle>

                            <path
                                d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"
                            ></path>

                            <path
                                d="M15 15c3 0 5 2 5 5"
                            ></path>

                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Club Reviews
                    </span>

                </a>



                <!-- Resources -->
                <a
                    href="resources.html"
                    class="sidebar-link"
                    data-page="resources"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 3h10l4 4v14H5z"></path>
                            <path d="M15 3v5h5"></path>
                            <path d="M8 12h8"></path>
                            <path d="M8 16h8"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Academic Resources
                    </span>

                </a>



                <!-- Placement -->
                <a
                    href="placement.html"
                    class="sidebar-link"
                    data-page="placement"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 20V10"></path>
                            <path d="M12 20V5"></path>
                            <path d="M19 20V8"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Placement Information
                    </span>

                </a>

            </nav>



            <!-- Logout -->
            <div class="sidebar-bottom">

                <button
                    type="button"
                    class="sidebar-logout"
                    id="logoutButton"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10 5H5v14h5"></path>
                            <path d="M14 8l4 4-4 4"></path>
                            <path d="M18 12H9"></path>
                        </svg>

                    </span>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </aside>



        <!-- =====================================================
             MAIN AREA
             ===================================================== -->

        <div class="app-main">


            <!-- =================================================
                 TOPBAR
                 ================================================= -->

            <header class="topbar">

                <div class="topbar-left">


                    <!-- Hamburger -->
                    <button
                        type="button"
                        class="menu-button"
                        id="sidebarToggle"
                        aria-label="Toggle navigation"
                        aria-expanded="true"
                    >

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>



                    <!-- Brand -->
                    <a
                        href="dashboard.html"
                        class="topbar-brand"
                    >

                        <span class="topbar-logo">

                            <img
                                src="assets/logo.png"
                                alt=""
                            >

                        </span>

                        <span class="topbar-brand-text">
                            Campus Knowledge Repository
                        </span>

                    </a>

                </div>



                <!-- Profile -->
                <div class="topbar-right">

                    <button
                        type="button"
                        class="profile-button"
                        id="profileButton"
                        aria-label="Open profile"
                    >

                        <span
                            class="profile-avatar"
                            id="topbarProfileAvatar"
                        >

                            <span id="topbarInitial">
                                —
                            </span>

                        </span>

                    </button>

                </div>

            </header>



            <!-- =================================================
                 PAGE CONTENT
                 ================================================= -->

            <main class="page-content club-content">


                <!-- =============================================
                     PAGE HEADER
                     ============================================= -->

                <section class="content-header">

                    <p class="content-eyebrow">
                        EXPLORE
                    </p>

                    <h1>
                        Club Reviews
                    </h1>

                    <p class="content-subtitle">
                        Discover what campus clubs are really like
                        from students who have been part of them.
                    </p>

                </section>



                <!-- =============================================
                     CLUB RESULTS
                     ============================================= -->

                <section
                    class="club-results"
                    id="clubResults"
                >


                    <!-- =========================================
                         EMPTY STATE
                         ========================================= -->

                    <div
                        class="empty-state club-empty-state"
                        id="clubEmptyState"
                    >

                        <div class="empty-state-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <circle
                                    cx="9"
                                    cy="8"
                                    r="3"
                                ></circle>

                                <circle
                                    cx="17"
                                    cy="9"
                                    r="2.5"
                                ></circle>

                                <path
                                    d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"
                                ></path>

                                <path
                                    d="M15 15c3 0 5 2 5 5"
                                ></path>

                            </svg>

                        </div>


                        <h2>
                            No clubs available yet
                        </h2>


                        <p>
                            Club information and reviews will appear
                            here once they are added to the repository.
                        </p>

                    </div>



                    <!-- =========================================
                         DYNAMIC CLUB CARDS
                         
                         MySQL → Flask → JavaScript
                         
                         No dummy clubs.
                         ========================================= -->

                    <div
                        class="club-card-grid"
                        id="clubCardGrid"
                    ></div>

                </section>

            </main>

        </div>

    </div>



    <!-- =========================================================
         CLUB REVIEWS MODAL
         ========================================================= -->

    <div
        class="app-modal-layer"
        id="clubReviewsModal"
        aria-hidden="true"
    >

        <div
            class="details-modal club-reviews-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="clubReviewsTitle"
        >


            <!-- Close -->
            <button
                type="button"
                class="modal-close-button"
                id="closeClubReviews"
                aria-label="Close"
            >
                ×
            </button>



            <!-- Header -->
            <div class="club-modal-header">

                <div class="club-modal-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="9"
                            cy="8"
                            r="3"
                        ></circle>

                        <circle
                            cx="17"
                            cy="9"
                            r="2.5"
                        ></circle>

                        <path
                            d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"
                        ></path>

                        <path
                            d="M15 15c3 0 5 2 5 5"
                        ></path>

                    </svg>

                </div>


                <div>

                    <h2 id="clubReviewsTitle">
                        Club Reviews
                    </h2>

                    <p id="clubReviewsSubtitle">
                        Student experiences
                    </p>

                </div>

            </div>



            <!-- Overall Rating -->
            <div class="club-overall-rating">

                <div class="club-rating-number">
                    <span id="clubOverallRating">
                        —
                    </span>
                </div>

                <div class="club-rating-info">

                    <div
                        class="star-display"
                        id="clubOverallStars"
                        aria-label="Overall rating"
                    >
                        ☆ ☆ ☆ ☆ ☆
                    </div>

                    <p>
                        <span id="clubReviewCount">
                            0
                        </span>
                        reviews
                    </p>

                </div>

            </div>



            <!-- Dynamic Reviews -->
            <div
                class="review-list"
                id="clubReviewList"
            >

                <div class="review-empty-state">

                    <p>
                        No reviews available yet.
                    </p>

                </div>

            </div>



            <!-- Write Review -->
            <button
                type="button"
                class="primary-button club-write-review-button"
                id="clubWriteReviewButton"
            >

                <span>
                    ✎
                </span>

                <span>
                    Write a Review
                </span>

            </button>

        </div>

    </div>



    <!-- =========================================================
         WRITE REVIEW MODAL
         ========================================================= -->

    <div
        class="app-modal-layer"
        id="clubReviewFormModal"
        aria-hidden="true"
    >

        <div
            class="details-modal club-review-form-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="clubReviewFormTitle"
        >


            <!-- Close -->
            <button
                type="button"
                class="modal-close-button"
                id="closeClubReviewForm"
                aria-label="Close"
            >
                ×
            </button>



            <!-- Header -->
            <div class="contribution-heading">

                <div class="contribution-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 20h4L19 9a2 2 0 0 0-3-3L5 17v3Z"
                        ></path>

                        <path
                            d="m14 7 3 3"
                        ></path>

                    </svg>

                </div>


                <div>

                    <p class="contribution-eyebrow">
                        CONTRIBUTE
                    </p>

                    <h2 id="clubReviewFormTitle">
                        Write a Club Review
                    </h2>

                    <p id="clubReviewClubName">
                        Share your experience with other students.
                    </p>

                </div>

            </div>



            <!-- Form -->
            <form
                id="clubReviewForm"
                class="contribution-form"
                novalidate
            >


                <!-- Joined -->
                <div class="form-field">

                    <label for="clubJoinedWhen">
                        When did you join the club?
                        <span>*</span>
                    </label>

                    <select
                        id="clubJoinedWhen"
                        name="joinedWhen"
                        required
                    >

                        <option value="">
                            Select semester
                        </option>

                        <option value="1">
                            Semester 1
                        </option>

                        <option value="2">
                            Semester 2
                        </option>

                        <option value="3">
                            Semester 3
                        </option>

                        <option value="4">
                            Semester 4
                        </option>

                        <option value="5">
                            Semester 5
                        </option>

                        <option value="6">
                            Semester 6
                        </option>

                        <option value="7">
                            Semester 7
                        </option>

                        <option value="8">
                            Semester 8
                        </option>

                    </select>

                </div>



                <!-- Rating -->
                <div class="form-field">

                    <label>
                        Rating
                        <span>*</span>
                    </label>

                    <div
                        class="rating-selector"
                        id="clubRatingSelector"
                        role="radiogroup"
                        aria-label="Club rating"
                    >

                        <button
                            type="button"
                            class="rating-star"
                            data-rating="1"
                            aria-label="1 star"
                        >
                            ★
                        </button>

                        <button
                            type="button"
                            class="rating-star"
                            data-rating="2"
                            aria-label="2 stars"
                        >
                            ★
                        </button>

                        <button
                            type="button"
                            class="rating-star"
                            data-rating="3"
                            aria-label="3 stars"
                        >
                            ★
                        </button>

                        <button
                            type="button"
                            class="rating-star"
                            data-rating="4"
                            aria-label="4 stars"
                        >
                            ★
                        </button>

                        <button
                            type="button"
                            class="rating-star"
                            data-rating="5"
                            aria-label="5 stars"
                        >
                            ★
                        </button>

                    </div>

                    <input
                        type="hidden"
                        id="clubRating"
                        name="rating"
                        value=""
                    >

                </div>



                <!-- Review -->
                <div class="form-field form-field-full">

                    <label for="clubReviewText">
                        Your Experience
                        <span>*</span>
                    </label>

                    <textarea
                        id="clubReviewText"
                        name="reviewText"
                        rows="7"
                        placeholder="Share your experience, what you liked, what you learned, the workload, opportunities, and anything useful for future members..."
                        required
                    ></textarea>

                </div>



                <!-- Footer -->
                <div class="contribution-form-footer">

                    <p class="form-required-note">
                        Fields marked with
                        <span>*</span>
                        are required.
                    </p>


                    <div class="form-actions">

                        <button
                            type="button"
                            class="secondary-button"
                            id="cancelClubReview"
                        >
                            Cancel
                        </button>


                        <button
                            type="submit"
                            class="primary-button"
                        >

                            <span>
                                Submit Review
                            </span>

                            <span>
                                →
                            </span>

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>



    <!-- =========================================================
         LOGOUT MODAL
         ========================================================= -->

    <div
        class="app-modal-layer"
        id="logoutModal"
        aria-hidden="true"
    >

        <div class="app-modal">

            <button
                type="button"
                class="modal-close-button"
                id="logoutModalClose"
                aria-label="Close"
            >
                ×
            </button>

            <div class="modal-icon">
                ↪
            </div>

            <h2>
                Log out?
            </h2>

            <p>
                Are you sure you want to leave the
                Campus Knowledge Repository?
            </p>

            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-button"
                    id="cancelLogout"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="primary-button"
                    id="confirmLogout"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="script.js"></script>

</body>

</html>
