<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hackathon Experiences | Campus Knowledge Repository">

    <link rel="stylesheet" href="style.css">
</head>


<body class="app-page hackathon-page">


    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <div class="app-background">

        <div class="app-orb app-orb-one"></div>
        <div class="app-orb app-orb-two"></div>
        <div class="app-orb app-orb-three"></div>

        <div class="app-arc app-arc-one"></div>
        <div class="app-arc app-arc-two"></div>

    </div>



    <!-- =========================================================
         APPLICATION SHELL
         ========================================================= -->

    <div class="app-shell" id="appShell">


        <!-- =====================================================
             SIDEBAR
             ===================================================== -->

        <aside
            class="sidebar"
            id="studentSidebar"
        >

            <!-- Brand -->
            <div class="sidebar-brand">

                <div class="sidebar-logo">

                    <img
                        src="assets/logo.png"
                        alt="Campus Knowledge Repository"
                    >

                </div>

                <div class="sidebar-brand-text">

                    <span>
                        Campus Knowledge
                    </span>

                    <span>
                        Repository
                    </span>

                </div>

            </div>



            <!-- Navigation -->
            <nav
                class="sidebar-navigation"
                aria-label="Student navigation"
            >


                <!-- Dashboard -->
                <a
                    href="dashboard.html"
                    class="sidebar-link"
                    data-page="dashboard"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 10.5 12 3l9 7.5"></path>
                            <path d="M5 9.5V21h14V9.5"></path>
                            <path d="M9 21v-6h6v6"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Dashboard
                    </span>

                </a>



                <!-- Interview -->
                <a
                    href="interview.html"
                    class="sidebar-link"
                    data-page="interview"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect
                                x="3"
                                y="7"
                                width="18"
                                height="13"
                                rx="2"
                            ></rect>

                            <path d="M8 7V5h8v2"></path>
                            <path d="M3 12h18"></path>
                            <path d="M10 12v2h4v-2"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Interview Experiences
                    </span>

                </a>



                <!-- Hackathon -->
                <a
                    href="hackathon.html"
                    class="sidebar-link active"
                    data-page="hackathon"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 7h8"></path>
                            <path d="M9 4h6v3H9z"></path>
                            <path d="M7 7v3"></path>
                            <path d="M17 7v3"></path>
                            <path d="M6 10h12"></path>
                            <path d="M12 10v8"></path>
                            <path d="M9 21h6"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Hackathon Experiences
                    </span>

                </a>



                <!-- Club -->
                <a
                    href="club.html"
                    class="sidebar-link"
                    data-page="club"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="9" cy="8" r="3"></circle>
                            <circle cx="17" cy="9" r="2.5"></circle>
                            <path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"></path>
                            <path d="M15 15c3 0 5 2 5 5"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Club Reviews
                    </span>

                </a>



                <!-- Resources -->
                <a
                    href="resources.html"
                    class="sidebar-link"
                    data-page="resources"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 3h10l4 4v14H5z"></path>
                            <path d="M15 3v5h5"></path>
                            <path d="M8 12h8"></path>
                            <path d="M8 16h8"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Academic Resources
                    </span>

                </a>



                <!-- Placement -->
                <a
                    href="placement.html"
                    class="sidebar-link"
                    data-page="placement"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 20V10"></path>
                            <path d="M12 20V5"></path>
                            <path d="M19 20V8"></path>
                        </svg>

                    </span>

                    <span class="sidebar-link-text">
                        Placement Information
                    </span>

                </a>

            </nav>



            <!-- Logout -->
            <div class="sidebar-bottom">

                <button
                    type="button"
                    class="sidebar-logout"
                    id="logoutButton"
                >

                    <span class="sidebar-link-icon">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10 5H5v14h5"></path>
                            <path d="M14 8l4 4-4 4"></path>
                            <path d="M18 12H9"></path>
                        </svg>

                    </span>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </aside>



        <!-- =====================================================
             MAIN
             ===================================================== -->

        <div class="app-main">


            <!-- =================================================
                 TOPBAR
                 ================================================= -->

            <header class="topbar">

                <div class="topbar-left">


                    <!-- Hamburger -->
                    <button
                        type="button"
                        class="menu-button"
                        id="sidebarToggle"
                        aria-label="Toggle navigation"
                        aria-expanded="true"
                    >

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>



                    <!-- Brand -->
                    <a
                        href="dashboard.html"
                        class="topbar-brand"
                    >

                        <span class="topbar-logo">

                            <img
                                src="assets/logo.png"
                                alt=""
                            >

                        </span>

                        <span class="topbar-brand-text">
                            Campus Knowledge Repository
                        </span>

                    </a>

                </div>



                <!-- Profile -->
                <div class="topbar-right">

                    <button
                        type="button"
                        class="profile-button"
                        id="profileButton"
                        aria-label="Open profile"
                    >

                        <span
                            class="profile-avatar"
                            id="topbarProfileAvatar"
                        >

                            <span id="topbarInitial">
                                —
                            </span>

                        </span>

                    </button>

                </div>

            </header>



            <!-- =================================================
                 PAGE CONTENT
                 ================================================= -->

            <main class="page-content hackathon-content">


                <!-- =============================================
                     HEADER
                     ============================================= -->

                <section class="content-header">

                    <p class="content-eyebrow">
                        EXPLORE
                    </p>

                    <h1>
                        Hackathon Experiences
                    </h1>

                    <p class="content-subtitle">
                        Build. Compete. Learn from real student journeys.
                    </p>

                </section>



                <!-- =============================================
                     SEARCH + ADD
                     ============================================= -->

                <section class="experience-toolbar">


                    <!-- Search -->
                    <div class="experience-search-wrapper">

                        <span class="search-icon">

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle
                                    cx="11"
                                    cy="11"
                                    r="7"
                                ></circle>

                                <path
                                    d="m16.5 16.5 4 4"
                                ></path>
                            </svg>

                        </span>

                        <input
                            type="search"
                            id="hackathonSearch"
                            class="experience-search"
                            placeholder="Search by hackathon name, technology, or keyword..."
                            autocomplete="off"
                        >

                    </div>



                    <!-- Add -->
                    <button
                        type="button"
                        class="contribution-plus-button"
                        id="hackathonAddButton"
                        aria-label="Share your hackathon experience"
                        title="Share your hackathon experience"
                    >
                        +
                    </button>

                </section>



                <!-- =============================================
                     FILTERS
                     ============================================= -->

                <section
                    class="filter-bar hackathon-filter-bar"
                    aria-label="Hackathon filters"
                >


                    <!-- Hackathon -->
                    <div class="filter-control">

                        <label
                            for="hackathonNameFilter"
                            class="sr-only"
                        >
                            Hackathon
                        </label>

                        <select
                            id="hackathonNameFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Hackathon
                            </option>

                        </select>

                    </div>



                    <!-- Role -->
                    <div class="filter-control">

                        <label
                            for="hackathonRoleFilter"
                            class="sr-only"
                        >
                            Role
                        </label>

                        <select
                            id="hackathonRoleFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Role
                            </option>

                        </select>

                    </div>



                    <!-- Semester -->
                    <div class="filter-control">

                        <label
                            for="hackathonSemesterFilter"
                            class="sr-only"
                        >
                            Semester
                        </label>

                        <select
                            id="hackathonSemesterFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Semester
                            </option>

                        </select>

                    </div>



                    <!-- Participation -->
                    <div class="filter-control">

                        <label
                            for="hackathonParticipationFilter"
                            class="sr-only"
                        >
                            Participation Type
                        </label>

                        <select
                            id="hackathonParticipationFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Participation Type
                            </option>

                            <option value="individual">
                                Individual
                            </option>

                            <option value="group">
                                Group
                            </option>

                        </select>

                    </div>



                    <!-- Technology -->
                    <div class="filter-control">

                        <label
                            for="hackathonTechnologyFilter"
                            class="sr-only"
                        >
                            Technology
                        </label>

                        <select
                            id="hackathonTechnologyFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Technology
                            </option>

                        </select>

                    </div>



                    <!-- Year -->
                    <div class="filter-control">

                        <label
                            for="hackathonYearFilter"
                            class="sr-only"
                        >
                            Year
                        </label>

                        <select
                            id="hackathonYearFilter"
                            class="filter-select"
                        >

                            <option value="">
                                Year
                            </option>

                        </select>

                    </div>



                    <!-- Clear -->
                    <button
                        type="button"
                        class="clear-filters-button"
                        id="clearHackathonFilters"
                    >
                        Clear Filters
                    </button>

                </section>



                <!-- =============================================
                     RESULTS
                     ============================================= -->

                <section
                    class="experience-results"
                    id="hackathonResults"
                >


                    <!-- =========================================
                         EMPTY STATE
                         ========================================= -->

                    <div
                        class="empty-state"
                        id="hackathonEmptyState"
                    >

                        <div class="empty-state-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M8 7h8"
                                ></path>

                                <path
                                    d="M9 4h6v3H9z"
                                ></path>

                                <path
                                    d="M7 7v3"
                                ></path>

                                <path
                                    d="M17 7v3"
                                ></path>

                                <path
                                    d="M6 10h12"
                                ></path>

                                <path
                                    d="M12 10v8"
                                ></path>

                                <path
                                    d="M9 21h6"
                                ></path>

                            </svg>

                        </div>


                        <h2>
                            No hackathon experiences yet
                        </h2>


                        <p>
                            Be the first to share your journey
                            and help future participants.
                        </p>


                        <button
                            type="button"
                            class="empty-state-action"
                            id="emptyHackathonShareButton"
                        >

                            <span>
                                ✎
                            </span>

                            <span>
                                Share Your Experience
                            </span>

                        </button>

                    </div>



                    <!-- =========================================
                         DYNAMIC CARDS
                         
                         Flask/MySQL data will be inserted here.
                         No dummy data.
                         ========================================= -->

                    <div
                        class="experience-card-grid hackathon-card-grid"
                        id="hackathonCardGrid"
                    ></div>

                </section>



                <!-- =============================================
                     SHARE EXPERIENCE
                     ============================================= -->

                <section
                    class="contribution-section"
                    id="shareHackathonSection"
                >

                    <div class="contribution-panel">


                        <!-- Heading -->
                        <div class="contribution-heading">

                            <div class="contribution-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <circle
                                        cx="12"
                                        cy="8"
                                        r="3"
                                    ></circle>

                                    <path
                                        d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                                    ></path>

                                    <path
                                        d="M16 4v4"
                                    ></path>

                                    <path
                                        d="M14 6h4"
                                    ></path>

                                </svg>

                            </div>


                            <div>

                                <p class="contribution-eyebrow">
                                    CONTRIBUTE
                                </p>

                                <h2>
                                    Share Your Hackathon Experience
                                </h2>

                                <p>
                                    Help your peers by sharing
                                    your journey.
                                </p>

                            </div>

                        </div>



                        <!-- =====================================
                             FORM
                             ===================================== -->

                        <form
                            id="hackathonForm"
                            class="contribution-form"
                            novalidate
                        >


                            <!-- Hackathon Name -->
                            <div class="form-field">

                                <label for="hackathonName">
                                    Hackathon Name
                                    <span>*</span>
                                </label>

                                <input
                                    type="text"
                                    id="hackathonName"
                                    name="hackathonName"
                                    placeholder="e.g. Smart India Hackathon"
                                    required
                                >

                            </div>



                            <!-- Semester -->
                            <div class="form-field">

                                <label for="hackathonSemester">
                                    Semester
                                    <span>*</span>
                                </label>

                                <select
                                    id="hackathonSemester"
                                    name="semester"
                                    required
                                >

                                    <option value="">
                                        Select semester
                                    </option>

                                    <option value="1">
                                        Semester 1
                                    </option>

                                    <option value="2">
                                        Semester 2
                                    </option>

                                    <option value="3">
                                        Semester 3
                                    </option>

                                    <option value="4">
                                        Semester 4
                                    </option>

                                    <option value="5">
                                        Semester 5
                                    </option>

                                    <option value="6">
                                        Semester 6
                                    </option>

                                    <option value="7">
                                        Semester 7
                                    </option>

                                    <option value="8">
                                        Semester 8
                                    </option>

                                </select>

                            </div>



                            <!-- Participation Type -->
                            <div class="form-field">

                                <label for="hackathonParticipation">
                                    Participation Type
                                    <span>*</span>
                                </label>

                                <select
                                    id="hackathonParticipation"
                                    name="participationType"
                                    required
                                >

                                    <option value="">
                                        Select type
                                    </option>

                                    <option value="individual">
                                        Individual
                                    </option>

                                    <option value="group">
                                        Group
                                    </option>

                                </select>

                            </div>



                            <!-- Team Size -->
                            <div
                                class="form-field"
                                id="teamSizeField"
                            >

                                <label for="hackathonTeamSize">
                                    Team Size
                                </label>

                                <input
                                    type="number"
                                    id="hackathonTeamSize"
                                    name="teamSize"
                                    min="2"
                                    placeholder="Enter team size"
                                    disabled
                                >

                                <small class="field-help">
                                    Required only for group participation.
                                </small>

                            </div>



                            <!-- Role -->
                            <div class="form-field">

                                <label for="hackathonRole">
                                    Your Role
                                    <span>*</span>
                                </label>

                                <input
                                    type="text"
                                    id="hackathonRole"
                                    name="role"
                                    placeholder="e.g. Developer, Team Lead"
                                    required
                                >

                            </div>



                            <!-- Technologies -->
                            <div class="form-field form-field-full">

                                <label for="hackathonTechnologies">
                                    Technologies Used
                                    <span>*</span>
                                </label>

                                <input
                                    type="text"
                                    id="hackathonTechnologies"
                                    name="technologies"
                                    placeholder="e.g. Python, Flask, MySQL, React, etc."
                                    required
                                >

                            </div>



                            <!-- Experience Summary -->
                            <div class="form-field form-field-full">

                                <label for="hackathonSummary">
                                    Experience Summary
                                    <span>*</span>
                                </label>

                                <textarea
                                    id="hackathonSummary"
                                    name="summary"
                                    rows="7"
                                    placeholder="Share your complete experience, what you built, key learnings, challenges, tips for future participants, etc..."
                                    required
                                ></textarea>

                            </div>



                            <!-- Date -->
                            <div class="form-field">

                                <label for="hackathonDate">
                                    Date
                                    <span>*</span>
                                </label>

                                <input
                                    type="date"
                                    id="hackathonDate"
                                    name="date"
                                    required
                                >

                            </div>



                            <!-- Footer -->
                            <div class="contribution-form-footer">

                                <p class="form-required-note">
                                    Fields marked with
                                    <span>*</span>
                                    are required.
                                </p>


                                <div class="form-actions">

                                    <button
                                        type="reset"
                                        class="secondary-button"
                                        id="cancelHackathonForm"
                                    >
                                        Cancel
                                    </button>


                                    <button
                                        type="submit"
                                        class="primary-button"
                                    >

                                        <span>
                                            Share Experience
                                        </span>

                                        <span>
                                            →
                                        </span>

                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </section>

            </main>

        </div>

    </div>



    <!-- =========================================================
         HACKATHON DETAILS MODAL
         
         Empty initially.
         JavaScript will populate it from database records.
         ========================================================= -->

    <div
        class="app-modal-layer"
        id="hackathonDetailsModal"
        aria-hidden="true"
    >

        <div
            class="details-modal hackathon-details-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="hackathonDetailsTitle"
        >


            <!-- Close -->
            <button
                type="button"
                class="modal-close-button"
                id="closeHackathonDetails"
                aria-label="Close"
            >
                ×
            </button>



            <!-- Header -->
            <div class="details-modal-header">

                <div
                    class="details-company-icon"
                    id="hackathonDetailsIcon"
                >
                    —
                </div>

                <div>

                    <h2 id="hackathonDetailsTitle">
                        Hackathon Experience
                    </h2>

                    <p id="hackathonDetailsStudent">
                        —
                    </p>

                </div>

            </div>



            <!-- Metadata -->
            <div
                class="details-meta"
                id="hackathonDetailsMeta"
            ></div>



            <!-- Technologies -->
            <div class="details-section">

                <h3>
                    Technologies Used
                </h3>

                <div
                    class="details-tags"
                    id="hackathonDetailsTechnologies"
                ></div>

            </div>



            <!-- Summary -->
            <div class="details-section">

                <h3>
                    Experience Summary
                </h3>

                <p id="hackathonDetailsSummary">
                    —
                </p>

            </div>



            <!-- Close -->
            <button
                type="button"
                class="secondary-button details-close-button"
                id="closeHackathonDetailsBottom"
            >
                Close
            </button>

        </div>

    </div>



    <!-- =========================================================
         LOGOUT MODAL
         ========================================================= -->

    <div
        class="app-modal-layer"
        id="logoutModal"
        aria-hidden="true"
    >

        <div class="app-modal">

            <button
                type="button"
                class="modal-close-button"
                id="logoutModalClose"
                aria-label="Close"
            >
                ×
            </button>

            <div class="modal-icon">
                ↪
            </div>

            <h2>
                Log out?
            </h2>

            <p>
                Are you sure you want to leave the
                Campus Knowledge Repository?
            </p>

            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-button"
                    id="cancelLogout"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="primary-button"
                    id="confirmLogout"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="script.js"></script>

</body>

</html>
